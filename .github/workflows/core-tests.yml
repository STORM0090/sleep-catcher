name: core tests

on:
  push:
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the googletest download
        uses: actions/cache@v4
        with:
          path: build/sleepcore/_deps
          key: gtest-${{ hashFiles('app/src/main/cpp/tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S app/src/main/cpp -B build/sleepcore -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/sleepcore --parallel

      - name: Run tests
        run: ctest --test-dir build/sleepcore --output-on-failure

  kotlin:
    runs-on: ubuntu-latest
    # The Android tooling on the runner changes from time to time, so a red
    # result here should not hide whether the core itself still works.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew testDebugUnitTest

name: tests

on: [push, pull_request]

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the C++ tests
        run: |
          cmake -S app/src/main/cpp -B build/sleepcore
          cmake --build build/sleepcore
          ctest --test-dir build/sleepcore --output-on-failure

  kotlin:
    runs-on: ubuntu-latest
    # Allowed to fail: the Android tools on the runner change without notice.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run the Kotlin tests
        run: ./gradlew testDebugUnitTest
